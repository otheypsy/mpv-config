# navigation keybindings force override only while playlist is visible
# if "no" then you can display the playlist by any of the navigation keys
dynamic_binds=yes

# To bind multiple keys separate them by a space

# Keys to show playlist
key_show_playlist=SHIFT+ENTER

# Keys to show command menu
key_open_menu=ALT+SHIFT+ENTER

# Display playlist while key is held down
key_peek_at_playlist=

# Dynamic keys
key_move_up=UP
key_move_down=DOWN
key_move_pageup=PGUP
key_move_pagedown=PGDWN
key_move_begin=HOME
key_move_end=END
key_select_file=RIGHT LEFT
key_unselect_file=
key_play_file=ENTER
key_remove_file=BS
key_close_playlist=ESC SHIFT+ENTER

# Extra functionality keys
key_sort_playlist=S
key_shuffle_playlist=
key_reverse_playlist=
key_load_files=
key_save_playlist=
key_select_playlist=

# JSON format for replacing, check .lua for explanation
# empty for no replace
# filename_replace=[{"protocol":{"all":true},"rules":[{"%%(%x%x)":"hex_to_char"}]}]
# filename_replace=[
#	 {"ext":{"all":true},"rules":[{"_":" "}]},
#	 {"ext":{"mp4":true,"mkv":true},"rules":[{"^(.+)%..+$":"%1"},{"%s*[%[%(].-[%]%)]%s*":""},{"(%w)%.(%w)":"%1 %2"}]},
#	 {"protocol":{"http":true,"https":true},"rules":[{"^%a+://w*%.?":""}]}
# ]

# filetypes to search from directory
loadfiles_filetypes=["jpg","jpeg","png","tif","tiff","gif","webp","svg","bmp","mp3","wav","ogm","flac","m4a","wma","ogg","opus","mkv","avi","mp4","ogv","webm","rmvb","flv","wmv","mpeg","mpg","m4v","3gp", "mov"]

# Load files at startup if 1 or more items in playlist
loadfiles_on_start=no
# Load files from working directory on idle startup
loadfiles_on_idle_start=no
# Always put loaded files after currently playing file
loadfiles_always_append=no

# Sort playlist when any files are added to playlist after initial load
sort_playlist_on_file_add=no

# Reverse playlist on startup
reverse_playlist_on_startup=no

# Default sorting method, must be one of: "name-asc", "name-desc", "date-asc", "date-desc", "size-asc", "size-desc".
default_sort=name-asc

# OS type: linux | windows | auto
system=auto

# Use ~ for home directory. Leave as empty to use mpv/playlists
playlist_save_path=

# Static filename to save playlist as.
# Will override existing playlist.
# Leave empty for generated name.
playlist_save_filename=temp_playlist.m3u
save_playlist_on_file_end=no
show_title_on_file_load=no
show_playlist_on_file_load=no
close_playlist_on_playfile=no

# Sync cursor when file is loaded from outside reasons(file-ending, playlist-next shortcut etc.)
sync_cursor_on_load=yes

# Remove files that are not found at path or directory
remove_file_not_found=yes

# Allow the playlist cursor to loop from end to start and vice versa
loop_cursor=yes

# Allow playlist-manager to write watch later config when navigating between files
allow_write_watch_later_config=yes

# Reset cursor navigation when closing or opening playlist
reset_cursor_on_close=yes
reset_cursor_on_open=yes

# Prefer to display titles for following files: "all", "url", "none". Sorting still uses filename
prefer_titles=url

# Executable for youtube-dl
# Relative or absolute path
youtube_dl_executable=yt-dlp

# Call youtube-dl to resolve the titles of urls in the playlist
# if yes, prefer_titles must be set to "url" or "all" for this to work
resolve_url_titles=no

# Call ffprobe to resolve the titles of local files in the playlist (if they exist in the metadata)
# if yes, prefer_titles must be set to "all" for this to work
resolve_local_titles=yes

# Call ffprobe to resolve the playtime duration of local files (if it exist in the metadata)
# Display duration in the playlist
# Use %dur in template to change placement
resolve_playtime_duration=yes

# Call ffprobe to resolve a local video file's resolution (if it exist in the metadata)
# Display duration in the playlist
# Use %res in template to change placement
resolve_video_resolution=yes

# Timeout in seconds for url title resolving
resolve_title_timeout=15

# How many url titles can be resolved at a time. Higher number might lead to stutters.
concurrent_title_resolve_limit=10

# OSD timeout on inactivity in seconds, use 0 for no timeout
playlist_display_timeout=0

# When peeking at playlist, show playlist at the very least for display timeout
peek_respect_display_timeout=no

# Maximum amount of lines playlist will render. -1 for auto calculate
show_amount=-1

# Playlist ASSA style overrides
# example {\q2\an7\fnUbuntu\fs10\b0\bord1} equals: line-wrap=no, align=top left, font=Ubuntu, size=10, bold=no, border=1
# read http://docs.aegisub.org/3.2/ASS_Tags/ for reference of tags
# undeclared tags will use default osd settings
# these styles will be used for the whole playlist
# \q2 style is recommended since filename wrapping may lead to unexpected rendering
# \an7 style is recommended to align to top left, otherwise osd-align-x/y is respected
style_ass_tags={\q2\an7\fs18\b0}

#paddings for left right and top bottom
text_padding_x=40
text_padding_y=70

# Screen dim when menu is open 0.0 - 1.0 (0 is no dim, 1 is black)
curtain_opacity=0.8

# Set title of window with stripped name
set_title_stripped=no
title_prefix=
title_suffix=

# Slice long filenames, and how many chars to show
slice_longfilenames=yes
slice_longfilenames_amount=120

# Playing header. One newline will be added after the string.
# %mediatitle or %filename = title or name of playing file
# %pos = position of playing file
# %cursor = position of navigation
# %plen = playlist length
# %N = newline
playlist_header=[ %cursor/%plen ]%N

# Playlist file templates
# %pos = position of file with leading zeros
# %name = title or name of file
# %dur = hh:mm:ss
# %res = resolution label
# %N = newline
# For example: selected_file={\c&HFF00FF&}➔ %name   | to add a color for selected file. However, if you
# Use ass tags you need to reset them for every line (see https://github.com/jonniek/mpv-playlistmanager/issues/20)
normal_file= 		   {\c&HB1ACA7&} ⭘  (%pos) [%dur] -- %res -- %name
hovered_file= 		   {\c&H07C1FF&} ⭗  (%pos) [%dur] -- %res -- %name
selected_file= 		   {\c&HF0CA0D&} ➔  (%pos) [%dur] -- %res -- %name
playing_file= 		   {\c&H4535DC&} ➤  (%pos) [%dur] -- %res -- %name
playing_hovered_file=  {\c&H07C1FF&} ➤  (%pos) [%dur] -- %res -- %name
playing_selected_file= {\c&HF0CA0D&} ➔  (%pos) [%dur] -- %res -- %name

# Playlist truncated indicators
playlist_sliced_prefix=...
playlist_sliced_suffix=...

# Output visual feedback to OSD when saving, shuffling, reversing playlists
display_osd_feedback=no

resolution_labels=[{"id":"not_found","label":"NULL"},{"id":"sd","label":"SD"},{"id":"hd","label":"HD"},{"id":"fhd","label":"FHD"},{"id":"qhd","label":"2K"},{"id":"uhd","label":"4K"}]
