##################
## --- Main --- ##
##################

# Ctrl+o      script-message-to dialog open           				    # event: click          # Files
# Ctrl+O      script-message-to dialog open-folder    				    # event: click          # Folder
# Ctrl+v      script-message-to dialog open-clipboard 				    # event: click          # Clipboard

MBTN_RIGHT  context-menu   	  										    # event: click          # Open Context Menu
`           script-binding commands/open                                # event: click          # Open Console

p           script-binding select/show-properties                       # event: click          # Show Properties
i           script-binding stats/display-stats   	      			    # event: click          # Stats Peak
t           script-binding stats/display-stats-toggle      			    # event: click          # Stats Toggle

q           show-text "Press `q` again to exit"                         # event: click          # Exit Warning
q           quit                                        			    # event: double_click   # Exit
R           run "cmd.exe" /d /c start "" ${path}; quit-watch-later      # event: click          # Hot Restart


#######################
## --- Subtitles --- ##
#######################

Shift+b     script-binding autosub/download_subs  					    # event: click          # Download Subs 1
Ctrl+b      script-binding autosub/download_subs2  					    # event: click          # Download Subs 2
Ctrl+[      add sub-delay -0.1            							    # event: click          # Delay -0.1
Ctrl+]      add sub-delay 0.1             							    # event: click          # Delay +0.1
{           add sub-pos -1                							    # event: click          # Move Up
}           add sub-pos 1                 		 					    # event: click          # Move Down


######################
## --- Playback --- ##
######################

F8          script-message playlist-manager show playlist toggle        # event: click          # Playlist Manager
Ctrl+l      script-binding quality-menu/video_formats_toggle  		    # event: click          # Video Stream Quality Toggle
Alt+l       script-binding quality-menu/audio_formats_toggle  		    # event: click          # Audio Stream Quality Toggle

MBTN_MID    cycle pause    	  											# event: click  		# Play/Pause
b           ab-loop                                         			# event: click  		# A-B loop
c           revert-seek                   		            			# event: click  		# Jump to Mark
v           revert-seek mark-permanent	  		            			# event: click			# Mark Position
KP7         playlist-prev                 		            			# event: click			# Previous File
KP9         playlist-next                 		            			# event: click			# Next File
[           add chapter -1				  		            			# event: click			# Previous Chapter
]           add chapter +1				  		            			# event: click			# Next Chapter

LEFT        script-message playback-controls seek -10       			# event: click			# 10s backward
RIGHT       script-message playback-controls seek  10       			# event: click			# 10s forward
KP1         script-message playback-controls seek -30       			# event: click			# 30s backward
KP3         script-message playback-controls seek  30       			# event: click			# 30s forward
KP4         script-message playback-controls seek -60       			# event: click			# 60s backward
KP6         script-message playback-controls seek  60       			# event: click			# 60s forward
Ctrl+r		cycle-values video-rotate 90 180 270 0          			# event: click			# Clockwise
Alt+r	    cycle-values video-rotate 270 180 90 0          			# event: click			# Counter-Clockwise

# 0         seek  0 absolute-percent+exact; show-text "0%"   # event: click             # Jump to 0%
# 1         seek 10 absolute-percent+exact; show-text "10%"  # event: click             # Jump to 10%
