#############################
## --- Shader Profiles --- ##
#############################

Ctrl+1      apply-profile "artcnn-32-ds"			                            # event: click
Ctrl+2      apply-profile "fsrcnn-x-16"		                                    # event: click
Ctrl+3      apply-profile "fsr"				                                    # event: click
Ctrl+4      apply-profile "ravu"				                                # event: click
Ctrl+5      apply-profile "nnedi3-128"		                                    # event: click
Ctrl+9      apply-profile "noise-static"		                                # event: click
Ctrl+0      change-list glsl-shaders clr "";show-text "GLSL shaders cleared"	# event: click
