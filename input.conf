##################
## --- Main --- ##
##################

MBTN_RIGHT  context-menu   	  										# Open Context Menu
MBTN_MID    cycle pause    	  										# Play/Pause
Shift+b     script-binding autosub/download_subs  					# Subtitle > Download Subs 1
Ctrl+b      script-binding autosub/download_subs2  					# Subtitle > Download Subs 2
Ctrl+[      add sub-delay -0.1            							# Subtitle > Delay -0.1
Ctrl+]      add sub-delay 0.1             							# Subtitle > Delay +0.1
{           add sub-pos -1                							# Subtitle > Move Up
}           add sub-pos 1                 		 					# Subtitle > Move Down
Ctrl+l      script-binding quality-menu/video_formats_toggle  		# Stream Quality > Video
Alt+l       script-binding quality-menu/audio_formats_toggle  		# Stream Quality > Audio

Ctrl+o      script-message-to dialog open           				# Open > Files...
Ctrl+O      script-message-to dialog open-folder    				# Open > Folder...
Ctrl+v      script-message-to dialog open-clipboard 				# Open > Clipboard

F8          script-message playlist-manager show playlist toggle    # View > Playlist Manager
b           ab-loop                                     			# Tools > Set/clear A-B loop points
i           script-binding stats/display-stats   	      			# Tools > Stats Peak
t           script-binding stats/display-stats-toggle      			# Tools > Stats Toggle
q           quit                                        			# Exit


######################
## --- Playback --- ##
######################

c           revert-seek                   		        # event: click 		# # Playback > Jump to Mark
v           revert-seek mark-permanent	  		        # event: click		# # Playback > Mark Position
KP7         playlist-prev                 		        # event: click		# # Playback > Previous File
KP9         playlist-next                 		        # event: click		# # Playback > Next File
[           add chapter -1				  		        # event: click		# # Playback > Previous Chapter
]           add chapter +1				  		        # event: click		# # Playback > Next Chapter

LEFT        script-message playback-controls seek -10   # event: click	# Seek 10s backward
RIGHT       script-message playback-controls seek  10   # event: click	# Seek 10s forward
KP1         script-message playback-controls seek -30   # event: click	# Seek 30s backward
KP3         script-message playback-controls seek  30   # event: click	# Seek 30s forward
KP4         script-message playback-controls seek -60   # event: click	# Seek 60s backward
KP6         script-message playback-controls seek  60   # event: click	# Seek 60s forward

