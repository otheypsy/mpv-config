## --- Shader Profiles --- ##
#############################

Ctrl+1      apply-profile "artcnn-32-ds"			# event: click
Ctrl+2      apply-profile "fsrcnn-16"		        # event: click
Ctrl+3      apply-profile "ravu-zoom-ar-r3"			# event: click
Ctrl+4      apply-profile "nnedi3-128"		        # event: click
Ctrl+5      apply-profile "fsr"				        # event: click
Ctrl+6      apply-profile "ssim-sr"		            # event: click
Ctrl+7      apply-profile "ssim-sd"		            # event: click
Ctrl+8      apply-profile "adaptive-sharpen"		# event: click
Ctrl+0      change-list glsl-shaders clr ""         # event: click
