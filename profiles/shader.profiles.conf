# -------------------------- #
# ---- Utility Profiles ---- #
# -------------------------- #

[ext-shader-cache]
profile-desc=Enable cache for compiled external shaders
profile-restore=copy-equal
gpu-shader-cache=yes
gpu-shader-cache-dir="~~/cache/shaders"

[mosaic-blur]
profile-desc=Configuration to enable mosaic blur for paused video content
profile-cond=p["current-tracks/video"] and not p["current-tracks/video"].image and p["pause"] == true
profile-restore=copy-equal
glsl-shader="~~/shaders/mosaic-blur.glsl"


# ------------------------- #
# ---- Shader Profiles ---- #
# ------------------------- #

[fsrcnnx-16]
profile-desc=[scaler] Fast Super-Resolution Convolutional Neural Network [x2] [16]
glsl-shader="~~/shaders/FSRCNNX_x2_16-0-4-1.glsl"

[fsrcnnx-16-distort]
profile-desc=[scaler] Fast Super-Resolution Convolutional Neural Network [x1] [16] [Distort]
glsl-shader="~~/shaders/FSRCNNX_x1_16-0-4-1_distort.glsl"

[artcnn-16-ds]
profile-desc=[scaler] Artoriuz Convolutional Neural Network [16 filters] [De-noise] [Sharpen]
glsl-shader="~~/shaders/ArtCNN_C4F16_DS.glsl"

[ravu-zoom-ar-r3]
profile-desc=[scaler] Rapid and Accurate Video Upscaling [Zoom] [AR-R3]
glsl-shader="~~/shaders/ravu-zoom-ar-r3.hook"

[fidelity-fx-fsr]
profile-desc=[scaler] AMD FidelityFX Super Resolution
glsl-shader="~~/shaders/FidelityFX_FSR.glsl"

[fidelity-fx-cas-scaled]
profile-desc=[scaler] AMD FidelityFX Contrast Adaptive Sharpening
glsl-shader="~~/shaders/FidelityFX_CAS_Scaled.glsl"

[nvidia-image-scaler]
profile-desc=[scaler] NVIDIA Image Scaling
glsl-shader="~~/shaders/NVScaler.glsl"

[nnedi3-128]
profile-desc=[scaler] Neural Network Edge Directed Interpolation
glsl-shader="~~/shaders/nnedi3-nns128-win8x4.hook"

[krig-bilateral]
profile-desc=[cscaler] KrigBilateral
glsl-shader="~~/shaders/KrigBilateral.glsl"

[cfl-prediction]
profile-desc=[cscaler] Chroma From Luma Prediction
glsl-shader="~~/shaders/CfL_Prediction.glsl"

[ssim-sr]
profile-desc=[scaler-tweaks] SSimSuperResolution
profile-restore=copy-equal
glsl-shader="~~/shaders/SSimSuperRes.glsl"
dscale=mitchell

[ssim-ds]
profile-desc=[dscaler] SSimDownscaler
profile-restore=copy-equal
glsl-shader="~~/shaders/SSimDownscaler.glsl"
dscale=mitchell
linear-downscaling=no

[adaptive-sharpen]
profile-desc=[sharpen] Adaptive Sharpen
glsl-shader="~~/shaders/adaptive-sharpen.glsl"

[noise-static]
profile-desc=[deband] Noise Static Luma and Chroma
profile-restore=copy-equal
deband-grain=0
glsl-shader="~~/shaders/noise_static_luma.hook"
glsl-shader="~~/shaders/noise_static_chroma.hook"


# -------------------------------- #
# ---- Video Quality Profiles ---- #
# -------------------------------- #

[sd]
profile-desc=Shader selection for SD content
profile-cond=height<720 and get("user-data/shaders/active")
profile-restore=copy-equal
profile=ext-shader-cache
glsl-shaders-clr
profile=fsrcnnx-16
profile=krig-bilateral
profile=ssim-sr
profile=ssim-ds

[hd]
profile-desc=Shader selection for 720p content
profile-cond=height==720 and get("user-data/shaders/active")
profile-restore=copy-equal
profile=ext-shader-cache
glsl-shaders-clr
profile=fsrcnnx-16
profile=krig-bilateral
profile=ssim-sr
profile=ssim-ds

[fhd]
profile-desc=Shader selection for 1080p content
profile-cond=height>720 and height<1440 and get("user-data/shaders/active")
profile-restore=copy-equal
profile=ext-shader-cache
glsl-shaders-clr
profile=artcnn-16-ds
profile=krig-bilateral
profile=ssim-sr
profile=ssim-ds

[qhd]
profile-desc=Shader selection for 1440p content
profile-cond=height>=1440 and height<2160 and get("user-data/shaders/active")
profile-restore=copy-equal
profile=ext-shader-cache
glsl-shaders-clr
profile=ssim-sr
profile=ssim-ds

[uhd]
profile-desc=Shader selection for 2160p content
profile-cond=height>=2160 and get("user-data/shaders/active")
profile-restore=copy-equal
profile=ext-shader-cache
glsl-shaders-clr
profile=ssim-sr
profile=ssim-ds
