# ------------------------- #
# ---- Shader Profiles ---- #
# ------------------------- #

[ext-shader-cache]
profile-desc=Enable cache for compiled external shaders
profile-restore=copy-equal
gpu-shader-cache=yes
gpu-shader-cache-dir="~~/cache/shaders"

[fsrcnnx-16]
profile-desc=[scaler] Fast Super-Resolution Convolutional Neural Network [x2] [16]
glsl-shaders-append="~~/shaders/FSRCNNX_x2_16-0-4-1.glsl"

[fsrcnnx-16-distort]
profile-desc=[scaler] Fast Super-Resolution Convolutional Neural Network [x1] [16] [Distort]
glsl-shaders-append="~~/shaders/FSRCNNX_x1_16-0-4-1_distort.glsl"

[artcnn-16-ds]
profile-desc=[scaler] Artoriuz Convolutional Neural Network [16 filters] [De-noise] [Sharpen]
glsl-shaders-append="~~/shaders/ArtCNN_C4F16_DS.glsl"

[ravu-zoom-ar-r3]
profile-desc=[scaler] Rapid and Accurate Video Upscaling [Zoom] [AR-R3]
glsl-shaders-append="~~/shaders/ravu-zoom-ar-r3.hook"

[fidelity-fx-fsr]
profile-desc=[scaler] AMD FidelityFX Super Resolution
glsl-shaders-append="~~/shaders/FidelityFX_FSR.glsl"

[fidelity-fx-cas-scaled]
profile-desc=[scaler] AMD FidelityFX Contrast Adaptive Sharpening
glsl-shaders-append="~~/shaders/FidelityFX_CAS_Scaled.glsl"

[nvidia-image-scaler]
profile-desc=[scaler] NVIDIA Image Scaling
glsl-shaders-append="~~/shaders/NVScaler.glsl"

[nnedi3-128]
profile-desc=[scaler] Neural Network Edge Directed Interpolation
glsl-shaders-append="~~/shaders/nnedi3-nns128-win8x4.hook"

[krig-bilateral]
profile-desc=[cscaler] KrigBilateral
glsl-shaders-append="~~/shaders/KrigBilateral.glsl"

[cfl-prediction]
profile-desc=[cscaler] Chroma From Luma Prediction
glsl-shaders-append="~~/shaders/CfL_Prediction.glsl"

[ssim-sr]
profile-desc=[scaler-tweaks] SSim SuperResolution
profile-restore=copy-equal
dscale=mitchell
glsl-shaders-append="~~/shaders/SSimSuperRes.glsl"

[ssim-ds]
profile-desc=[dscaler] SSim Downscaler
profile-restore=copy-equal
dscale=mitchell
linear-downscaling=no
glsl-shaders-append="~~/shaders/SSimDownscaler.glsl"

[adaptive-sharpen]
profile-desc=[sharpen] Adaptive Sharpen
glsl-shaders-append="~~/shaders/adaptive-sharpen.glsl"

[noise-static]
profile-desc=[deband] Noise Static Luma and Chroma
profile-restore=copy-equal
deband-grain=0
glsl-shaders-append="~~/shaders/noise_static_luma.hook"
glsl-shaders-append="~~/shaders/noise_static_chroma.hook"


# -------------------------------- #
# ---- Video Quality Profiles ---- #
# -------------------------------- #

[sd]
profile-desc=Shader selection for SD content
profile-cond=height<720
profile-restore=copy-equal
profile=ext-shader-cache
glsl-shaders-clr
profile=fsrcnnx-16
profile=krig-bilateral
profile=ssim-sr
profile=adaptive-sharpen

[hd]
profile-desc=Shader selection for 720p content
profile-cond=height==720
profile-restore=copy-equal
profile=ext-shader-cache
glsl-shaders-clr
profile=fsrcnnx-16
profile=krig-bilateral
profile=adaptive-sharpen

[fhd]
profile-desc=Shader selection for 1080p content
profile-cond=height>720 and height<1440
profile-restore=copy-equal
profile=ext-shader-cache
glsl-shaders-clr
profile=fsrcnnx-16
profile=krig-bilateral
profile=ssim-ds
profile=adaptive-sharpen

[qhd]
profile-desc=Shader selection for 1440p content
profile-cond=height>=1440 and height<2160
profile-restore=copy-equal
profile=ext-shader-cache
glsl-shaders-clr
profile=krig-bilateral
profile=adaptive-sharpen

[uhd]
profile-desc=Shader selection for 2160p content
profile-cond=height>=2160
profile-restore=copy-equal
profile=ext-shader-cache
glsl-shaders-clr
profile=krig-bilateral
profile=ssim-ds
profile=adaptive-sharpen
